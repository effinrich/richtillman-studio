name: "Chromatic"

# Required status check. No paths: filter — a skipped workflow never creates
# a check run and would block merge. TurboSnap keeps builds fast.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  chromatic:
    name: Run Chromatic
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Publish to Chromatic
        uses: chromaui/action@2a0b63f30233c48591844a46d451b9cf68128186 # v18.7.2
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: packages/ui
          exitZeroOnChanges: false
          zip: true
