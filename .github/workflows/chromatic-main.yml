name: "Chromatic — baseline"

on:
  push:
    branches: [main]
    paths:
      - "packages/ui/src/**"
      - "packages/ui/.storybook/**"
      - "packages/ui/package.json"
      - "packages/ui/turbo.json"
      - "packages/ui/chromatic.config.json"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/chromatic-main.yml"
  workflow_dispatch:

jobs:
  chromatic-baseline:
    name: Update visual baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build Storybook
        run: bunx turbo run build-storybook --filter=@richtillman/ui
      - name: Publish baseline to Chromatic
        uses: chromaui/action@2a0b63f30233c48591844a46d451b9cf68128186 # v18.7.2
        with:
          workingDir: packages/ui
          storybookBuildDir: storybook-static
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          autoAcceptChanges: true
