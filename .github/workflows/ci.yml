name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx turbo run typecheck --affected
      - name: Lint
        run: bunx turbo run lint --affected
      - name: Test
        run: bunx turbo run test --affected
      - name: Build compiled packages
        run: bunx turbo run build --filter=@richtillman/storybook-mcp
